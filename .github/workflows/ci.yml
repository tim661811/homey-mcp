name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the checkout.
permissions:
  contents: read

jobs:
  # Runs the same scan as the pre-commit hook, over the whole tree. A local hook
  # can be bypassed with --no-verify; this one cannot.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-secrets.mjs

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor, because homey-api declares engines node>=24.
        node-version: ['24', 'lts/*']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
